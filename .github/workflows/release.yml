name: release

# Publish the package to PyPI (test.pypi.org or pypi.org).
#
# Triggered two ways:
#   - push a tag `v*`  -> publishes to PyPI (the real release). The tag name
#     should match the version in pyproject.toml, e.g. `v0.1.0`.
#   - manual `workflow_dispatch` -> pick the target from the dropdown:
#       - testpypi (default): https://test.pypi.org/
#       - pypi               : https://pypi.org/ (real, permanent)
#
# Nothing is uploaded unless the `test` job (the full suite) passes.
#
# Authentication:
#   - testpypi uses an API token, set the secret: TESTPYPI_TOKEN.
#   - pypi uses OIDC Trusted Publishing (no token). Register a Trusted Publisher
#     on pypi.org -> account side-bar -> Publishing -> Add trusted publisher:
#       Owner: AECVerge, Repository: pygments-step,
#       Workflow name: release.yml (the filename),
#       Environment name: leave blank (this job has no `environment:`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygments-step
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publishing to PyPI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and publish tooling
        run: python -m pip install -U build twine

      - name: Build the package
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Resolve publish target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ github.event.inputs.target }}"
          else
            # A `v*` tag push is an official release -> publish to PyPI.
            target="pypi"
          fi
          echo "value=$target" >> "$GITHUB_OUTPUT"

      - name: Publish to TestPyPI
        if: steps.target.outputs.value == 'testpypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
        run: twine upload -r testpypi dist/*

      - name: Publish to PyPI
        if: steps.target.outputs.value == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
