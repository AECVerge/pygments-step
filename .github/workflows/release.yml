name: release

# Manual, reviewable publish. Actions run on the released branch where you can
# select the target from the "Run workflow" dropdown:
#   - testpypi  (default) : upload to https://test.pypi.org/
#   - pypi                : upload to https://pypi.org/ (real, permanent)
#
# Workflow: publish to testpypi first, confirm the install, then re-run the same
# workflow choosing "pypi" once you have set the PYPI_TOKEN secret. Nothing is
# published unless this job succeeds.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   TESTPYPI_TOKEN  test.pypi.org API token (username is __token__)
#   PYPI_TOKEN      pypi.org API token (username is __token__; only needed to
#                   select the "pypi" target)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygments-step
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and publish tooling
        run: python -m pip install -U build twine

      - name: Build the package
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
        run: twine upload -r testpypi dist/*

      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
