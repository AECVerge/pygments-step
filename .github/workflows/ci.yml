name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package (editable) so Pygments discovers the `express` and
      # `step21` lexers through entry points. Tests, including the docs-page
      # lexing test (tests/test_docs_pages.py), rely on this.
      - name: Install pygments-step
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

  # The strict docs build is a separate job (run once, on the oldest supported
  # Python) so it is not repeated for every matrix entry. It is gated on the
  # full test matrix passing.
  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the package itself (editable) so the code fences on the demo page
      # are highlighted by these lexers.
      - name: Install pygments-step
        run: pip install -e ".[test]"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation (strict)
        run: mkdocs build --strict
