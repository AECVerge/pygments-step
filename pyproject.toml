[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-step"
version = "0.1.0"
description = "Pygments lexers for EXPRESS (ISO 10303-11) and STEP Part 21 (ISO 10303-21)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AECVerge", email = "wubzbz@126.com" }]
keywords = [
    "pygments",
    "lexer",
    "syntax-highlighting",
    "express",
    "step",
    "iso-10303",
    "part21",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["Pygments>=2.14"]

[project.urls]
Homepage = "https://github.com/AECVerge/pygments-step"
Repository = "https://github.com/AECVerge/pygments-step"
Issues = "https://github.com/AECVerge/pygments-step/issues"

# Registering here is what makes ```express / ```step21 code fences work.
# Pygments discovers these automatically once the package is installed.
[project.entry-points."pygments.lexers"]
express = "pygments_step:ExpressLexer"
step21 = "pygments_step:StepFileLexer"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["pygments_step"]
